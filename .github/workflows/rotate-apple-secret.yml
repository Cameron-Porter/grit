name: Rotate Apple Client Secret

on:
  schedule:
    # Runs on the 1st of every 5th month — well before the 6-month expiry
    - cron: '0 9 1 */5 *'
  workflow_dispatch: # allows manual trigger from GitHub Actions UI

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate and push new secret
        env:
          APPLE_P8_KEY: ${{ secrets.APPLE_P8_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node - <<'EOF'
          import { createSign } from 'crypto';

          const key      = process.env.APPLE_P8_KEY;
          const teamId   = process.env.APPLE_TEAM_ID;
          const keyId    = process.env.APPLE_KEY_ID;
          const clientId = 'com.gritfitness.app';
          const now      = Math.floor(Date.now() / 1000);
          const exp      = now + 15777000;

          const header  = Buffer.from(JSON.stringify({ alg: 'ES256', kid: keyId })).toString('base64url');
          const payload = Buffer.from(JSON.stringify({ iss: teamId, iat: now, exp, aud: 'https://appleid.apple.com', sub: clientId })).toString('base64url');
          const data    = `${header}.${payload}`;
          const sign    = createSign('SHA256');
          sign.update(data);
          const jwt = `${data}.${sign.sign({ key, dsaEncoding: 'ieee-p1363' }, 'base64url')}`;

          const res = await fetch(`https://api.supabase.com/v1/projects/${process.env.SUPABASE_PROJECT_REF}/config/auth`, {
            method: 'PATCH',
            headers: {
              'Authorization': `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ external_apple_secret: jwt }),
          });

          if (!res.ok) {
            console.error('Supabase API error:', res.status, await res.text());
            process.exit(1);
          }
          console.log('Apple client secret rotated successfully.');
          EOF
