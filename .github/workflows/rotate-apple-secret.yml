name: Rotate Apple Client Secret

on:
  schedule:
    # Runs on the 1st of every 5th month — well before the 6-month expiry
    - cron: '0 9 1 */5 *'
  workflow_dispatch: # allows manual trigger from GitHub Actions UI

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write p8 key to temp file
        run: echo "${{ secrets.APPLE_P8_KEY }}" > /tmp/AuthKey.p8

      - name: Generate and push new secret
        run: |
          JWT=$(node scripts/generate-apple-secret.mjs \
            --key /tmp/AuthKey.p8 \
            --team-id ${{ secrets.APPLE_TEAM_ID }} \
            --key-id ${{ secrets.APPLE_KEY_ID }} \
            --quiet)
          curl --fail-with-body -s -X PATCH \
            "https://api.supabase.com/v1/projects/${{ secrets.SUPABASE_PROJECT_REF }}/config/auth" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"external_apple_secret\": \"$JWT\"}"

      - name: Shred key file
        if: always()
        run: shred -u /tmp/AuthKey.p8
